# ==========================================
# Quarkus Application & Virtual Threads
# ==========================================
quarkus.application.name=personal-finance-backend
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, x-tenant-id
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, PATCH

# OpenAPI & Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi

# ==========================================
# OpenID Connect (OIDC) & Stateless JWT Validation
# ==========================================
quarkus.oidc.auth-server-url=http://localhost:8088/realms/personal-finance-realm
quarkus.oidc.client-id=personal-finance-backend
quarkus.oidc.application-type=service
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.token.issuer=any
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.jwks.cache-size=10
quarkus.oidc.jwks.cache-time-to-live=10m
quarkus.oidc.tls.verification=none

# ==========================================
# Zero-Trust Global API Authentication Policy
# ==========================================
quarkus.http.auth.permission.public.paths=/q/swagger-ui*, /q/openapi*, /q/health*, /q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated
%dev.quarkus.http.auth.permission.authenticated.policy=permit

# ==========================================
# ==========================================
# PostgreSQL Database & Agroal Connection Pool
# ==========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:pf_user}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:pf_password}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/personal_finance}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.acquisition-timeout=5

# ==========================================
# Redis Client Configuration
# ==========================================
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.timeout=5s

# ==========================================
# Redpanda / Kafka Messaging Configuration
# ==========================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer Channels with Partition Affinity (StringSerializer for Message Key)
mp.messaging.outgoing.spreadsheet-events-out.connector=smallrye-kafka
mp.messaging.outgoing.spreadsheet-events-out.topic=financial.events.spreadsheet
mp.messaging.outgoing.spreadsheet-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.spreadsheet-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.transaction-events-out.connector=smallrye-kafka
mp.messaging.outgoing.transaction-events-out.topic=financial.events.transactions
mp.messaging.outgoing.transaction-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.transaction-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.alert-events-out.connector=smallrye-kafka
mp.messaging.outgoing.alert-events-out.topic=financial.events.alerts
mp.messaging.outgoing.alert-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.alert-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer Channels (Virtual Threads for High-Concurrency Processing)
mp.messaging.incoming.spreadsheet-events-in.connector=smallrye-kafka
mp.messaging.incoming.spreadsheet-events-in.topic=financial.events.spreadsheet
mp.messaging.incoming.spreadsheet-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.spreadsheet-events-in.group.id=pf-spreadsheet-projections
mp.messaging.incoming.spreadsheet-events-in.auto.offset.reset=earliest

mp.messaging.incoming.transaction-events-in.connector=smallrye-kafka
mp.messaging.incoming.transaction-events-in.topic=financial.events.transactions
mp.messaging.incoming.transaction-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transaction-events-in.group.id=pf-transaction-projections
mp.messaging.incoming.transaction-events-in.auto.offset.reset=earliest

# ==========================================
# OpenTelemetry Tracing
# ==========================================
quarkus.otel.enabled=true
quarkus.otel.service.name=personal-finance-core
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.protocol=grpc

# ==========================================
# AI / Gemini Intelligence Configuration
# ==========================================
gemini.api-key=${GEMINI_API_KEY:}
gemini.model.chat=gemini-3.5-flash-lite
gemini.model.vision=gemini-3.5-flash-lite
gemini.mock-mode=${GEMINI_MOCK_MODE:false}
gemini.temperature=0.2

# Logging
quarkus.log.category."com.personalfinance".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
